<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"><rect width="375" height="812" fill="#F0F0F0"/><rect x="0" y="0" width="375" height="812" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="0" width="375" height="96" rx="0" fill="#FFFFFF" stroke="none"/><text x="21" y="14" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">9:41</text><text x="305" y="14" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">◉  ▰</text><rect x="272" y="42" width="87" height="32" rx="16" fill="#FFFFFF" stroke="#C2C2C2"/><text x="293" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#242424" text-anchor="middle" dominant-baseline="central" xml:space="preserve">···</text><path d="M314,49L314,67" stroke="#C2C2C2" stroke-width="1" fill="none"/><text x="336" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#242424" text-anchor="middle" dominant-baseline="central" xml:space="preserve">◎</text><rect x="11" y="38" width="44" height="44" rx="8" fill="#FFFFFF" stroke="none"/><text x="33.0" y="60.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="central" xml:space="preserve">〈</text><text x="65" y="52" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经验详情</text><path d="M0,95L375,95" stroke="#C2C2C2" stroke-width="1" fill="none"/><rect x="315" y="105" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#C2C2C2"/><rect x="328" y="120" width="2" height="2" rx="0" fill="#3A3A3A" stroke="none"/><path d="M334,121L346,121" stroke="#3A3A3A" stroke-width="1" fill="none"/><rect x="328" y="126" width="2" height="2" rx="0" fill="#3A3A3A" stroke="none"/><path d="M334,127L346,127" stroke="#3A3A3A" stroke-width="1" fill="none"/><rect x="328" y="132" width="2" height="2" rx="0" fill="#3A3A3A" stroke="none"/><path d="M334,133L346,133" stroke="#3A3A3A" stroke-width="1" fill="none"/><text x="16" y="112" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">第一份实习长文｜Java 后端</text><text x="16" y="144" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">从准备到投递</text><rect x="16" y="188" width="70.0" height="24" rx="5" fill="#E4E4E4" stroke="none"/><text x="24" y="195" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#3A3A3A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Java 后端</text><rect x="92" y="188" width="112" height="24" rx="5" fill="#E4E4E4" stroke="none"/><text x="100" y="195" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#3A3A3A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">计算机科学与技术</text><text x="16" y="221" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">城院帮资料整理 · 公开来源</text><text x="16" y="247" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5A5A5A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">两位 Java 学生从 2025 年 3 月投出第一份简历到拿到</text><text x="16" y="270" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5A5A5A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">offer 的完整时间线，含项目、简历、笔试、一面、二</text><text x="16" y="293" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5A5A5A" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">面与保底选择，附投递前清单。</text><path d="M16,324L359,324" stroke="#C2C2C2" stroke-width="1" fill="none"/><text x="16" y="344" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">这篇写给正准备投第一份 Java 后端实习、却不</text><text x="16" y="371" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">确定从哪一步开始的读者。下面的时间线、投递</text><text x="16" y="398" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">数量和面试题目，来自三位学生在牛客公开发布</text><text x="16" y="425" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">的求职记录：一位双非本科、211 硕士的 Java 学</text><text x="16" y="452" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">生，一位浙江工业大学计科的双非本科生，一位</text><text x="16" y="479" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">民办本科、只有一段短实习的学生。三人起点、</text><text x="16" y="506" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">节奏、结果都不同，所以这里不把任何一个人的</text><text x="16" y="533" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经验写成通用公式，只把能对上的部分拼成一条</text><text x="16" y="560" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">可参照的路径，并逐段说明哪些只是个人经历。</text><text x="16" y="600" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">一、先确认自己属于哪种起点</text><text x="16" y="636" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">第一种是&quot;确定方向晚&quot;。那位浙工大作者自述，</text><text x="16" y="663" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#242424" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">他到大二暑假才正式坚定走 Java，2025 年 3 …</text><rect x="0" y="742" width="375" height="70" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0,742L375,742" stroke="#C2C2C2" stroke-width="1" fill="none"/><rect x="16" y="749" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#C2C2C2"/><text x="63.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="central" xml:space="preserve">收藏</text><rect x="120" y="749" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#C2C2C2"/><text x="158.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="central" xml:space="preserve">点赞</text><rect x="204" y="749" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#C2C2C2"/><text x="238.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="central" xml:space="preserve">硬币</text><rect x="284" y="749" width="75" height="44" rx="8" fill="#FFFFFF" stroke="#C2C2C2"/><text x="321.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="central" xml:space="preserve">评论</text><rect x="138" y="804" width="98" height="4" rx="2" fill="#242424" stroke="none"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"><rect width="375" height="812" fill="#F4F6F9"/><rect x="0" y="0" width="375" height="812" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="0" width="375" height="96" rx="0" fill="#FFFFFF" stroke="none"/><text x="21" y="14" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">9:41</text><text x="305" y="14" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">◉  ▰</text><rect x="272" y="42" width="87" height="32" rx="16" fill="#FFFFFF" stroke="#DEE5EF"/><text x="293" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">···</text><path d="M314,49L314,67" stroke="#DEE5EF" stroke-width="1" fill="none"/><text x="336" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">◎</text><rect x="11" y="38" width="44" height="44" rx="8" fill="#FFFFFF" stroke="none"/><text x="33.0" y="60.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">〈</text><text x="65" y="52" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经验详情</text><path d="M0,95L375,95" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="315" y="105" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><rect x="328" y="120" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,121L346,121" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="328" y="126" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,127L346,127" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="328" y="132" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,133L346,133" stroke="#0052D9" stroke-width="1" fill="none"/><text x="16" y="164" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">四、项目：从课程设计到能讲十分钟</text><text x="16" y="209" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#176344" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">城院帮资料整理 · 来源按原文列出</text><text x="16" y="236" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">一个能讲的项目要回答四件事</text><text x="16" y="276" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">做什么、谁用、你负责哪一块、遇到什么问题怎</text><text x="16" y="303" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">么解决。时间线 B 的第一份实习被他定义为&quot;Dem</text><text x="16" y="330" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">o CRUD、没有权限文档&quot;，不到两个月就离开—</text><text x="16" y="357" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">—门槛不在功能多少，在有没有真实的约束和取</text><text x="16" y="384" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">舍。</text><text x="16" y="424" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">一个月能改出什么</text><text x="16" y="464" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">时间线 B 的做法是&quot;调整两个项目&quot;：把功能收窄</text><text x="16" y="491" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">、把能讲清楚的部分做深。这比新开三个项目省</text><text x="16" y="518" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">时间，也更适合只剩一个月的情况。</text><text x="16" y="558" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">讲项目的四句话</text><text x="16" y="598" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">场景和用户、技术选型与理由、最难的点和处理</text><text x="16" y="625" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">过程、数据或结果。第四句说不出来的部分，面</text><text x="16" y="652" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">试时不要主动往那儿引。</text><rect x="0" y="742" width="375" height="70" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0,742L375,742" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="16" y="749" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="63.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">收藏</text><rect x="120" y="749" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="158.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">点赞</text><rect x="204" y="749" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="238.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">硬币</text><rect x="284" y="749" width="75" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="321.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">评论</text><rect x="138" y="804" width="98" height="4" rx="2" fill="#162238" stroke="none"/></svg>

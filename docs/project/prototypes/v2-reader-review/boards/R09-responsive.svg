<svg xmlns="http://www.w3.org/2000/svg" width="390" height="812" viewBox="0 0 390 812"><rect width="390" height="812" fill="#F4F6F9"/><rect x="0" y="0" width="390" height="812" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="0" width="390" height="96" rx="0" fill="#FFFFFF" stroke="none"/><text x="21" y="14" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">9:41</text><text x="320" y="14" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">◉  ▰</text><rect x="287" y="42" width="87" height="32" rx="16" fill="#FFFFFF" stroke="#DEE5EF"/><text x="308" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">···</text><path d="M329,49L329,67" stroke="#DEE5EF" stroke-width="1" fill="none"/><text x="351" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">◎</text><rect x="11" y="38" width="44" height="44" rx="8" fill="#FFFFFF" stroke="none"/><text x="33.0" y="60.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">〈</text><text x="65" y="52" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经验详情</text><path d="M0,95L390,95" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="330" y="105" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><rect x="343" y="120" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M349,121L361,121" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="343" y="126" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M349,127L361,127" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="343" y="132" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M349,133L361,133" stroke="#0052D9" stroke-width="1" fill="none"/><text x="16" y="112" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">第一份实习长文｜Java 后端从</text><text x="16" y="144" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">准备到投递</text><rect x="16" y="188" width="70.0" height="24" rx="5" fill="#E8F1FF" stroke="none"/><text x="24" y="195" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#0052D9" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">Java 后端</text><rect x="92" y="188" width="112" height="24" rx="5" fill="#E8F1FF" stroke="none"/><text x="100" y="195" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#0052D9" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">计算机科学与技术</text><text x="16" y="221" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#526179" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">城院帮资料整理 · 公开来源</text><text x="16" y="247" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526179" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">两位 Java 学生从 2025 年 3 月投出第一份简历到拿到</text><text x="16" y="270" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526179" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">offer 的完整时间线，含项目、简历、笔试、一面、二面</text><text x="16" y="293" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526179" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">与保底选择，附投递前清单。</text><path d="M16,324L374,324" stroke="#DEE5EF" stroke-width="1" fill="none"/><text x="16" y="344" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">这篇写给正准备投第一份 Java 后端实习、却不确</text><text x="16" y="371" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">定从哪一步开始的读者。下面的时间线、投递数量</text><text x="16" y="398" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">和面试题目，来自三位学生在牛客公开发布的求职</text><text x="16" y="425" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">记录：一位双非本科、211 硕士的 Java 学生，一位</text><text x="16" y="452" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">浙江工业大学计科的双非本科生，一位民办本科、</text><text x="16" y="479" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">只有一段短实习的学生。三人起点、节奏、结果都</text><text x="16" y="506" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">不同，所以这里不把任何一个人的经验写成通用公</text><text x="16" y="533" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">式，只把能对上的部分拼成一条可参照的路径，并</text><text x="16" y="560" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">逐段说明哪些只是个人经历。</text><text x="16" y="600" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">一、先确认自己属于哪种起点</text><text x="16" y="636" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">第一种是&quot;确定方向晚&quot;。那位浙工大作者自述，他</text><text x="16" y="663" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">到大二暑假才正式坚定走 Java，2025 年 3 月初…</text><rect x="0" y="742" width="390" height="70" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0,742L390,742" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="16" y="749" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="63.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">收藏</text><rect x="120" y="749" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="158.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">点赞</text><rect x="204" y="749" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="238.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">硬币</text><rect x="299" y="749" width="75" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="336.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">评论</text><rect x="146" y="804" width="98" height="4" rx="2" fill="#162238" stroke="none"/></svg>

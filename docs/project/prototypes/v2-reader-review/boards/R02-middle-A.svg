<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"><rect width="375" height="812" fill="#F4F6F9"/><rect x="0" y="0" width="375" height="812" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="0" width="375" height="96" rx="0" fill="#FFFFFF" stroke="none"/><text x="21" y="14" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">9:41</text><text x="305" y="14" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">◉  ▰</text><rect x="272" y="42" width="87" height="32" rx="16" fill="#FFFFFF" stroke="#DEE5EF"/><text x="293" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">···</text><path d="M314,49L314,67" stroke="#DEE5EF" stroke-width="1" fill="none"/><text x="336" y="58" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="middle" dominant-baseline="central" xml:space="preserve">◎</text><rect x="11" y="38" width="44" height="44" rx="8" fill="#FFFFFF" stroke="none"/><text x="33.0" y="60.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">〈</text><text x="65" y="52" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">经验详情</text><path d="M0,95L375,95" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="315" y="105" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><rect x="328" y="120" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,121L346,121" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="328" y="126" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,127L346,127" stroke="#0052D9" stroke-width="1" fill="none"/><rect x="328" y="132" width="2" height="2" rx="0" fill="#0052D9" stroke="none"/><path d="M334,133L346,133" stroke="#0052D9" stroke-width="1" fill="none"/><text x="16" y="164" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">三、起步阶段：把缺口分成三类</text><text x="16" y="209" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">项目</text><text x="16" y="249" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">三人的项目都来自课程设计、实验室或自学小作</text><text x="16" y="276" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">品，没有一个是&quot;为大厂定制&quot;的。时间线 B 的作</text><text x="16" y="303" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">者在拿到第一份 offer 后，专门花一个月&quot;调整</text><text x="16" y="330" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">了两个项目&quot;，他把它当成秋招前的必要动作。</text><text x="16" y="370" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">基础</text><text x="16" y="410" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">时间线 A 在暑期面试里连续挂掉，复盘落点是准</text><text x="16" y="437" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">备不足，不是没有经历。集合、Spring、事务、</text><text x="16" y="464" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">网络协议这几块在笔试和一面里被反复检查。</text><text x="16" y="504" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">算法与手写</text><text x="16" y="544" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">小厂笔试往往很基础，但会有手写。南昌工学院</text><text x="16" y="571" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">那位两张笔试卷&quot;基本都答出来了&quot;，进技术面仍</text><text x="16" y="598" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#162238" text-anchor="start" dominant-baseline="text-before-edge" xml:space="preserve">被要求&quot;手撕 list&quot;，并追问数组越界异常。</text><rect x="0" y="742" width="375" height="70" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0,742L375,742" stroke="#DEE5EF" stroke-width="1" fill="none"/><rect x="16" y="749" width="95" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="63.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">收藏</text><rect x="120" y="749" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="158.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">点赞</text><rect x="204" y="749" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="238.0" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">硬币</text><rect x="284" y="749" width="75" height="44" rx="8" fill="#FFFFFF" stroke="#DEE5EF"/><text x="321.5" y="771.0" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0052D9" text-anchor="middle" dominant-baseline="central" xml:space="preserve">评论</text><rect x="138" y="804" width="98" height="4" rx="2" fill="#162238" stroke="none"/></svg>

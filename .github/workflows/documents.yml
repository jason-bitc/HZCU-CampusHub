name: Project document checks
on:
  pull_request:
    paths: ['docs/**', 'scripts/check_project_docs.py', 'scripts/Sync-ProjectDocs.ps1', '.github/workflows/documents.yml', '.gitattributes']
  push:
    paths: ['docs/**', 'scripts/check_project_docs.py', 'scripts/Sync-ProjectDocs.ps1', '.github/workflows/documents.yml', '.gitattributes']
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared document manifest and companions
        run: python3 scripts/check_project_docs.py
